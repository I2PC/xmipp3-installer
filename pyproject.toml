[project]
name = "xmipp3-installer"
version = "2.2.0"
authors = [
  { name = "Martín Salinas", email = "ssalinasmartin@gmail.com" },
]
description = "Package to handle the installation of Xmipp3"
keywords = ["xmipp3", "installer"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: POSIX :: Linux"
]
readme = "README.md"
license = { text = "GPL-3.0-only" }

requires-python = ">=3.11"
dependencies = [
  "distro>=1.8.0,<=1.9.0"
]

[build-system]
requires = [
  "setuptools>=83.0.0",
  "wheel"
]
build-backend = "setuptools.build_meta"

[dependency-groups]
test = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-subprocess==1.6.0",
  "pytest-localserver==0.10.0.post0",
  "ruff==0.17.1",
  "cmake==4.4.4",
  "ninja==1.13.2"
]
release = [
  "build==1.6.1",
  "twine==7.0.0",
  "setuptools==84.2.1",
  "wheel==0.48.0"
]

[project.urls]
Homepage = "https://github.com/I2PC/xmipp3-installer"
Issues = "https://github.com/I2PC/xmipp3-installer/issues"

[project.scripts]
xmipp3_installer = "xmipp3_installer.__main__:main"
