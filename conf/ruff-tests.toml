target-version = "py38"

include = [
  "tests/**/*.py"
]

[lint]
select = ["E4", "E7", "E9", "F"]
extend-select = [
  "UP",  # pyupgrade
  "PL",  # pylint
]
ignore = [
  "PLC0414", # Useless import alias
  "PLR0913", # Too many arguments in function definition
  "PLR0917" # Too many positional arguments
]

[lint.pydocstyle]
convention = "pep257"
