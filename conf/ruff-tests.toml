target-version = "py38"

include = [
  "tests/**/*.py"
]

[lint]
select = ["E4", "E7", "E9", "F"]
extend-select = [
  "UP",   # pyupgrade
  "PL",   # pylint
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RET",  # flake8-return
  "PIE",  # flake8-pie
  "PERF", # perflint
  "RUF",  # ruff-specific rules
]
ignore = [
  "PLC0414", # Useless import alias
  "PLR0913", # Too many arguments in function definition
  "PLR0917" # Too many positional arguments
]

[lint.pydocstyle]
convention = "pep257"
