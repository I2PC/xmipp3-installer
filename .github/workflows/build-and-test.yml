name: Build package in standalone version
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: build-standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    permissions:
      contents: read
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}

    strategy:
      matrix:
        python-version:
        - '3.8'
        - '3.9'
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        - '3.15'
        # setup-python has no builds of these versions for newer Ubuntu releases
        include:
        - python-version: '3.8'
          runner: ubuntu-24.04
        - python-version: '3.9'
          runner: ubuntu-24.04

    steps:
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install project
        run: |
          pip install --only-binary :all: --require-hashes -r conf/requirements-test.txt
          pip install --only-binary :all: --no-deps -e .

      - name: Use CLI standalone
        run: ${{ vars.MODULE_NAME }} -h

      - name: Use CLI as Python module
        run: python -m ${{ vars.MODULE_NAME }} -h

      - name: Check code with Ruff
        run: python -m ruff check --config ./conf/ruff.toml

      - name: Run unitary tests
        env:
          SCRIPT_PATH: ./scripts/run-tests.sh
        run: |
          chmod +x $SCRIPT_PATH
          $SCRIPT_PATH unitary

      - name: Run integration tests
        env:
          SCRIPT_PATH: ./scripts/run-tests.sh
        run: |
          chmod +x $SCRIPT_PATH
          $SCRIPT_PATH integration

      - name: Run e2e tests
        env:
          SCRIPT_PATH: ./scripts/run-tests.sh
        run: |
          chmod +x $SCRIPT_PATH
          $SCRIPT_PATH e2e

      - name: Generate report files
        if: matrix.python-version == '3.15'
        run: |
          python -m coverage combine ./conf/coverage
          python -m coverage xml
          zip reports.zip coverage.xml report.xml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.python-version == '3.15'
        with:
          name: test-reports
          path: reports.zip

  sonar-scan:
    name: Sonar scan
    permissions:
      contents: read
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: test-reports
          path: ${{ github.workspace }}

      - name: Unzip reports
        run: unzip reports.zip

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
